<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind in Antwerp 3D </title>

  <link rel="icon" href="data:,">

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css?v=1" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }

    /* Dataset selector box */
    #layer-switch {
      position: absolute;
      top: 20px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      z-index: 20;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }

    /* Legend box */
    #legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      z-index: 10;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }

    #legend h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Dataset selector -->
  <div id="layer-switch">
    <label for="dataset"><b>Dataset:</b></label>
    <select id="dataset">
    <option value="comfort">Wind Comfort</option>
    <option value="storm">Wind Storm</option>
    <option value="trees">Vegetation</option>
    <option value="quality">Air quality</option>
    <option value="speed" selected>Mean Wind Speed</option>
    </select>
  </div>

  <!-- Legend -->
  <div id="legend">
    <h4 id="legend-title">Wind speed</h4>
    <img id="legend-img" src="windspeed_legend.PNG" style="width:400px; display:block;">
  </div>

  <!-- Map -->
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken =
      'pk.eyJ1Ijoicm9iZXJtIiwiYSI6ImNtazZrdXd5NjBtYmYzZXNoOXB3YmxweWEifQ.OcryZGeruMGRUOaCpAiO5w';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      center: [4.412743, 51.199949],
      zoom: 13,
      pitch: 60,
      bearing: -5
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    map.on('load', () => {

      /* ------------------ 3D BUILDINGS ------------------ */
      map.addSource('bld-v10', {
        type: 'geojson',
        data: 'bld_antwerp.geojson'
      });

      map.addLayer({
        id: 'bld-v10-3d',
        type: 'fill-extrusion',
        source: 'bld-v10',
        paint: {
          'fill-extrusion-color': '#818589',
          'fill-extrusion-height': [
            'coalesce',
            ['to-number', ['get', 'height']],
            0
          ],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.95
        }
      });

      /* ------------------ WIND COMFORT OVERLAY ------------------ */
      map.addSource('wind-comfort-img', {
        type: 'image',
        url: 'map_windcomfort_web.png',
        coordinates: [
          [4.354281665, 51.263371520],  // top-left
          [4.485654003, 51.263371520],  // top-right
          [4.485654003, 51.166687855],  // bottom-right
          [4.354281665, 51.166687855]   // bottom-left
        ]
      });

        map.addLayer({
            id: 'wind-comfort-layer',
            type: 'raster',
            source: 'wind-comfort-img',
            layout: { visibility: 'none' },  // start hidden
            paint: { 'raster-opacity': 0.75 }
        });

      /* ------------------ WIND SPEED OVERLAY ------------------ */
      map.addSource('wind-speed-img', {
        type: 'image',
        url: 'map_windspeed_web.png',
        coordinates: [
          [4.354281665, 51.263371520],  // top-left
          [4.485654003, 51.263371520],  // top-right
          [4.485654003, 51.166687855],  // bottom-right
          [4.354281665, 51.166687855]   // bottom-left
        ]
      });

      map.addLayer({
        id: 'wind-speed-layer',
        type: 'raster',
        source: 'wind-speed-img',
        layout: { visibility: 'visible' },  
        paint: { 'raster-opacity': 0.75 }
      });
            /* ------------------ WIND STORM OVERLAY ------------------ */
      map.addSource('wind-storm-img', {
        type: 'image',
        url: 'map_windstorm_web.png',
        coordinates: [
          [4.354281665, 51.263371520],  // top-left
          [4.485654003, 51.263371520],  // top-right
          [4.485654003, 51.166687855],  // bottom-right
          [4.354281665, 51.166687855]   // bottom-left
        ]
      });

      map.addLayer({
        id: 'wind-storm-layer',
        type: 'raster',
        source: 'wind-storm-img',
        layout: { visibility: 'none' },  
        paint: { 'raster-opacity': 0.75 }
      });

                  /* ------------------ TREES OVERLAY ------------------ */
      map.addSource('trees-img', {
        type: 'image',
        url: 'tree_layer_web.png',
        coordinates: [
          [4.352063665, 51.263730520],  // top-left
          [4.483436003, 51.263730520],  // top-right
          [4.483436003, 51.167046855],  // bottom-right
          [4.352063665, 51.167046855]   // bottom-left
        ]

       });

       map.addLayer({
         id: 'trees-layer',
         type: 'raster',
         source: 'trees-img',
         layout: { visibility: 'none' },  
         paint: { 'raster-opacity': 0.70 }
       });

      /* ------------------ Air Quality OVERLAY ------------------ */
      map.addSource('air-quality-img', {
        type: 'image',
        url: 'map_airquality_web.png',
        coordinates: [
          [4.354697, 51.23801931],  // top-left
          [4.45128, 51.2380],  // top-right
          [4.4512179, 51.195991],  // bottom-right
          [4.35448025, 51.19607922]   // bottom-left
        ]
      });

      map.addLayer({
        id: 'air-quality-layer',
        type: 'raster',
        source: 'air-quality-img',
        layout: { visibility: 'none' },  
        paint: { 'raster-opacity': 0.75 }
      });

      /* Put wind overlays above the building extrusions */
      map.moveLayer('wind-comfort-layer', 'bld-v10-3d');
      map.moveLayer('wind-storm-layer', 'bld-v10-3d');
      map.moveLayer('wind-speed-layer', 'bld-v10-3d');
      map.moveLayer('trees-layer', 'bld-v10-3d');
      map.moveLayer('air-quality-layer', 'bld-v10-3d');

      /* ------------------ SWITCHING LOGIC ------------------ */
      const selector = document.getElementById("dataset");
      const legendTitle = document.getElementById("legend-title");
      const legendImg = document.getElementById("legend-img");

      selector.addEventListener("change", (e) => {
        const value = e.target.value;

        if (value === "comfort") {
          map.setLayoutProperty("wind-comfort-layer", "visibility", "visible");
          map.setLayoutProperty("wind-speed-layer", "visibility", "none");
          map.setLayoutProperty("wind-storm-layer", "visibility", "none");
          map.setLayoutProperty("trees-layer", "visibility", "none");
          map.setLayoutProperty("air-quality-layer", "visibility", "none");

          legendTitle.innerText = "Wind comfort";
          legendImg.src = "windcomfort_legend.PNG";
        }

        if (value === "storm") {
          map.setLayoutProperty("wind-comfort-layer", "visibility", "none");
          map.setLayoutProperty("wind-speed-layer", "visibility", "none");
          map.setLayoutProperty("wind-storm-layer", "visibility", "visible");
          map.setLayoutProperty("trees-layer", "visibility", "none");
          map.setLayoutProperty("air-quality-layer", "visibility", "none");

          legendTitle.innerText = "Wind storm";
          legendImg.src = "windstorm_legend.PNG";
        }
        if (value === "trees") {
          map.setLayoutProperty("wind-comfort-layer", "visibility", "none");
          map.setLayoutProperty("wind-speed-layer", "visibility", "none");
          map.setLayoutProperty("wind-storm-layer", "visibility", "none");
          map.setLayoutProperty("trees-layer", "visibility", "visible");
          map.setLayoutProperty("air-quality-layer", "visibility", "none");

          legendTitle.innerText = "Trees";
          legendImg.src = "trees_legend.png";
        }
        if (value === "quality") {
          map.setLayoutProperty("wind-comfort-layer", "visibility", "none");
          map.setLayoutProperty("wind-speed-layer", "visibility", "none");
          map.setLayoutProperty("wind-storm-layer", "visibility", "none");
          map.setLayoutProperty("trees-layer", "visibility", "none");
          map.setLayoutProperty("air-quality-layer", "visibility", "visible");

          legendTitle.innerText = "Air quality";
          legendImg.src = "air_quality_legend.png";
        }

        if (value === "speed") {
          map.setLayoutProperty("wind-comfort-layer", "visibility", "none");
          map.setLayoutProperty("wind-speed-layer", "visibility", "visible");
          map.setLayoutProperty("wind-storm-layer", "visibility", "none");
          map.setLayoutProperty("trees-layer", "visibility", "none");
          map.setLayoutProperty("air-quality-layer", "visibility", "none");

          legendTitle.innerText = "Wind speed";
          legendImg.src = "windspeed_legend.PNG";  // <-- update if needed
        }
      });

      /* Debug click on buildings */
      map.on('click', 'bld-v10-3d', (e) => {
        console.log('Building properties:', e.features[0].properties);
      });

    });
  </script>
</body>
</html>
