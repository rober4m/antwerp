<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Antwerp 3D buildings</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }

    #legend {
  position: absolute;   /* THIS makes it overlap */
  bottom: 30px;
  left: 10px;
  background: rgba(255, 255, 255, 0.9);
  padding: 10px 12px;
  border-radius: 8px;
  font-family: Arial, sans-serif;
  z-index: 10;          /* THIS ensures it is above the map */
  box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }
    #legend h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="legend">
  <h4>Wind comfort</h4>
  <img src="windcomfort_legend.PNG" style="width:300px; display:block;">
  </div>

  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken =
      'pk.eyJ1Ijoicm9iZXJtIiwiYSI6ImNtaHNiNzdvaTB0ancyanIxYXRxdzM2ODUifQ.r9Q7oTBpFo_Woqh2i0Vm5g';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      center: [4.4025, 51.2194],
      zoom: 13,
      pitch: 60,
      bearing: -5
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    map.on('load', () => {

      map.addSource('bld-v10', {
        type: 'geojson',
        data: 'bld_antwerp.geojson'
      });

      // Extrude using the feature property "height"
      map.addLayer({
        id: 'bld-v10-3d',
        type: 'fill-extrusion',
        source: 'bld-v10',
        paint: {
          'fill-extrusion-color': '#999999',
          'fill-extrusion-height': [
            'coalesce',
            ['to-number', ['get', 'height']],  // read height property
            0
          ],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.75
        }
      });

      map.addSource('wind-img', {
      type: 'image',
      url: 'map_windcomfort_web.png',
      coordinates: [
        [4.354281665, 51.263371520],  // top-left
        [4.485654003, 51.263371520],  // top-right
        [4.485654003, 51.166687855],  // bottom-right
        [4.354281665, 51.166687855]   // bottom-left
      ]
    });

      map.addLayer({
      id: 'wind-layer',
      type: 'raster',
      source: 'wind-img',
      paint: { 'raster-opacity': 0.75 }
    });

      map.moveLayer('wind-layer', 'bld-v10-3d');

      map.on('click', 'bld-v10-3d', (e) => {
        console.log('Building properties:', e.features[0].properties);
      });
    });
  </script>
</body>
</html>
